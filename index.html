<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word Land">
<meta name="theme-color" content="#cdeaff">
<meta name="format-detection" content="telephone=no">
<title>Word and Number Land</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --ink: #1d2a44;
    --sky1: #d9f0ff;
    --sky2: #fff6e0;
    --read: #7b61ff;
    --math: #ff9f1c;
    --good: #2ecc71;
    --card: #ffffff;
    --font: "Avenir Next", "Avenir", "Nunito", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; position: fixed;
    background: linear-gradient(180deg, var(--sky1), var(--sky2));
    color: var(--ink); font-family: var(--font);
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; color: inherit; -webkit-appearance: none; appearance: none; border: 0; cursor: pointer; touch-action: none; }
  .screen {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: none; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .screen.on { display: flex; }

  /* ---------- home ---------- */
  #home { align-items: center; justify-content: center; background: url("art/bg-home.webp") center / cover no-repeat, linear-gradient(180deg, var(--sky1), var(--sky2)); }
  #play { background-position: center; background-size: cover; background-repeat: no-repeat; }
  .world img.ic { width: calc(var(--t) * 0.7); height: calc(var(--t) * 0.7); object-fit: contain; filter: drop-shadow(0 0.8vmin 0 rgba(0,0,0,0.12)); pointer-events: none; }
  .homehelper { position: absolute; bottom: env(safe-area-inset-bottom, 0px); width: min(24vmin, 230px); pointer-events: none; animation: bob 3.4s ease-in-out infinite; }
  .homehelper.l { left: max(1vmin, env(safe-area-inset-left, 0px)); }
  .homehelper.r { right: max(1vmin, env(safe-area-inset-right, 0px)); animation-delay: -1.7s; }
  @media (orientation: portrait) { .homehelper { width: min(26vw, 200px); } }
  #homeTop { position: absolute; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 13vmin; display: flex; align-items: center; justify-content: space-between; padding: 0 3vmin; }
  .roundBtn { width: 11vmin; height: 11vmin; max-width: 84px; max-height: 84px; border-radius: 50%; background: rgba(255,255,255,0.85); box-shadow: 0 4px 0 rgba(0,0,0,0.12); font-size: min(6vmin, 46px); display: flex; align-items: center; justify-content: center; }
  .roundBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
  .smallBtn { width: 8vmin; height: 8vmin; max-width: 56px; max-height: 56px; font-size: min(4.5vmin, 30px); opacity: 0.7; }
  .starCount { font-size: min(7vmin, 52px); font-weight: 700; display: flex; align-items: center; gap: 1vmin; background: rgba(255,255,255,0.7); padding: 0.6vmin 3vmin; border-radius: 99px; }
  #worlds { --t: min(27vw, 34vh); display: flex; gap: 4vmin; flex-wrap: wrap; justify-content: center; align-items: center; max-width: calc(var(--t) * 3 + 10vmin); margin-top: 8vmin; }
  @media (orientation: portrait) { #worlds { --t: min(40vw, 23vh); max-width: calc(var(--t) * 2 + 6vmin); } }
  .world {
    width: var(--t); height: var(--t); border-radius: 6vmin; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vmin;
    box-shadow: 0 1.6vmin 0 rgba(0,0,0,0.18); position: relative; animation: bob 3s ease-in-out infinite;
  }
  .world:active { transform: translateY(1.2vmin); box-shadow: 0 0.4vmin 0 rgba(0,0,0,0.18); }
  .world .big { font-size: calc(var(--t) * 0.36); line-height: 1; filter: drop-shadow(0 1vmin 0 rgba(0,0,0,0.15)); }
  .world .deco { font-size: calc(var(--t) * 0.13); font-weight: 800; letter-spacing: 0.08em; opacity: 0.95; }
  .world .lvl { display: flex; align-items: center; gap: calc(var(--t) * 0.03); font-size: calc(var(--t) * 0.1); line-height: 1; }
  .lbar { width: calc(var(--t) * 0.5); height: calc(var(--t) * 0.06); background: rgba(0,0,0,0.2); border-radius: 99px; overflow: hidden; }
  .lbar > div { height: 100%; background: #fff; border-radius: 99px; }
  #homeMid { display: flex; align-items: center; gap: 2.5vmin; }
  #who { display: flex; align-items: center; gap: 1.6vmin; }
  .kid { width: 9vmin; height: 9vmin; max-width: 68px; max-height: 68px; padding: 0; border-radius: 50%; background: rgba(255,255,255,0.75); font-size: min(5.6vmin, 42px); line-height: 1; display: flex; align-items: center; justify-content: center; opacity: 0.85; }
  .kid.me { opacity: 1; background: #fff; transform: scale(1.15); box-shadow: 0 0 0 0.7vmin #ffd23f, 0 4px 0 rgba(0,0,0,0.12); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.2vmin); } }

  /* ---------- play ---------- */
  #topbar { height: 13vmin; min-height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 3vmin; flex: 0 0 auto; }
  #dots { display: flex; gap: 1.6vmin; }
  .dot { width: 4.4vmin; height: 4.4vmin; max-width: 34px; max-height: 34px; border-radius: 50%; background: rgba(255,255,255,0.75); box-shadow: inset 0 0 0 0.5vmin rgba(0,0,0,0.12); transition: background 0.3s, transform 0.3s; }
  .dot.full { background: #ffd23f; transform: scale(1.15); box-shadow: inset 0 0 0 0.5vmin rgba(0,0,0,0.08), 0 0 2vmin rgba(255,210,63,0.9); }
  .bar { width: min(42vw, 380px); height: 3.4vmin; max-height: 26px; background: rgba(255,255,255,0.8); border-radius: 99px; overflow: hidden; box-shadow: inset 0 0 0 0.5vmin rgba(0,0,0,0.08); }
  .bar > div { height: 100%; background: linear-gradient(90deg, #ffd23f, #ffb703); border-radius: 99px; transition: width 0.5s ease-out; }
  .barstar { font-size: min(5vmin, 38px); margin-left: 1vmin; }
  #dots { align-items: center; }
  #speaker.wiggle { animation: wiggle 1.2s ease-in-out infinite; background: #fff3b0; }
  #stage { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 0 3vmin 3vmin; position: relative; min-height: 0; }
  #stage.enter #prompt, #stage.enter #choices { animation: slideIn 0.35s ease-out both; }
  #stage.enter #choices { animation-delay: 0.08s; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(4vmin) scale(0.96); } to { opacity: 1; transform: none; } }

  .prompt { background: var(--card); border-radius: 5vmin; padding: 2.5vmin 5vmin; box-shadow: 0 1.2vmin 0 rgba(0,0,0,0.08); text-align: center; max-width: 92vw; box-sizing: border-box; }
  .prompt.word { font-size: min(15vmin, 130px); font-weight: 700; letter-spacing: 0.04em; padding: 1vmin 7vmin; }
  .prompt.sentence { font-size: min(7.4vmin, 64px); font-weight: 600; line-height: 1.35; }
  .prompt.story { font-size: min(4.6vmin, 40px); font-weight: 600; line-height: 1.5; text-align: left; max-width: min(92vw, 1000px); }
  .prompt.story p { margin: 0.3em 0; }
  .prompt .q { margin-top: 0.6em; color: var(--read); }
  .prompt.say { font-size: min(10vmin, 80px); padding: 2vmin 5vmin; }
  .gap { display: inline-block; min-width: 3.2em; border-bottom: 0.12em dashed #9aa6c2; margin: 0 0.15em; line-height: 1.1; color: var(--good); }
  .gap.filled { border-bottom-color: transparent; animation: popIn 0.4s ease-out; }

  .choices { display: flex; gap: 3.5vmin; justify-content: center; align-items: center; flex-wrap: wrap; max-width: 96vw; }
  .tile {
    background: var(--card); border-radius: 4vmin; box-shadow: 0 1.2vmin 0 rgba(0,0,0,0.12);
    display: flex; align-items: center; justify-content: center; position: relative;
    transition: transform 0.15s, opacity 0.3s, background 0.3s;
  }
  .tile:active { transform: translateY(0.8vmin); }
  .tile.pic { width: min(27vw, 30vh); height: min(27vw, 30vh); font-size: min(15vmin, 130px); }
  .tile.scene { width: min(29vw, 34vh); padding: 0; overflow: hidden; }
  .tile.word { font-size: min(8.5vmin, 70px); font-weight: 700; padding: 2.4vmin 5vmin; min-width: 18vmin; }
  .tile.word.sm { font-size: min(6.6vmin, 54px); padding: 2vmin 3.6vmin; min-width: 0; }
  .tile.num { width: min(21vw, 24vh); height: min(21vw, 24vh); font-size: min(14vmin, 120px); font-weight: 800; color: #e2571e; }
  .tile.two { width: min(30vw, 30vh); height: min(30vw, 30vh); font-size: min(18vmin, 150px); }
  .tile.multi { min-width: min(26vw, 26vh); height: min(22vw, 24vh); font-size: min(11vmin, 92px); padding: 0 3vmin; letter-spacing: -0.05em; }
  .tile.right { background: #c9f7d9; transform: scale(1.1); box-shadow: 0 0 0 1vmin var(--good), 0 1.2vmin 0 rgba(0,0,0,0.12); z-index: 2; }
  .tile.out { opacity: 0.35; }
  .tile.used { visibility: hidden; }
  .tile.hint { animation: wiggle 0.9s ease-in-out infinite; box-shadow: 0 0 0 0.8vmin #ffd23f, 0 1.2vmin 0 rgba(0,0,0,0.12); }
  .shake { animation: shake 0.45s ease-in-out; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-2.5vmin) rotate(-4deg); } 40% { transform: translateX(2.5vmin) rotate(4deg); } 60% { transform: translateX(-1.5vmin); } 80% { transform: translateX(1.5vmin); } }
  @keyframes wiggle { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-7deg) scale(1.06); } 75% { transform: rotate(7deg) scale(1.06); } }
  @keyframes popIn { 0% { transform: scale(0.3); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }

  /* scenes: emoji placed on a 4:3 card, sized in container units */
  .scenebox { position: relative; width: 100%; aspect-ratio: 4 / 3; container-type: inline-size; background: linear-gradient(180deg, #eef8ff 0 72%, #e3f3d8 72% 100%); }
  .scenebox span { position: absolute; transform: translate(-50%, -50%); line-height: 1; }

  /* build a sentence */
  .prompt.build { display: flex; flex-direction: column; align-items: center; gap: 2vmin; }
  .bpic { font-size: min(14vmin, 110px); line-height: 1; }
  .slots { display: flex; gap: 1.6vmin; flex-wrap: wrap; justify-content: center; }
  .slot { min-width: 12vmin; height: 10vmin; border-radius: 2.4vmin; border: 0.6vmin dashed #b9c3da; font-size: min(6.6vmin, 54px); font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 1.6vmin; box-sizing: border-box; }
  .slot.filled { border: 0.6vmin solid #c9f7d9; background: #eafff1; animation: popIn 0.35s ease-out; }

  /* numbers */
  .prompt.eq { display: flex; align-items: flex-start; gap: 3vmin; padding: 3vmin 5vmin; }
  .term { display: flex; flex-direction: column; align-items: center; gap: 1.5vmin; }
  .term .n { font-size: min(14vmin, 120px); font-weight: 800; line-height: 1; min-width: 1.2em; text-align: center; }
  .term .n.q { color: #fff; background: #b9c3da; border-radius: 2.5vmin; padding: 0 0.15em; }
  .term .n.q.filled { background: var(--good); animation: popIn 0.4s ease-out; }
  .op { font-size: min(12vmin, 100px); font-weight: 800; line-height: 1.15; color: #8a94ad; }
  .mini { display: grid; grid-template-columns: repeat(5, auto); gap: 0.4vmin; font-size: min(4.6vmin, 38px); line-height: 1.1; min-height: 1em; }
  .feed { display: flex; align-items: center; gap: 4vmin; font-size: min(12vmin, 100px); }
  .apples { display: grid; grid-template-columns: repeat(3, auto); gap: 1.4vmin; }
  .apples.five { grid-template-columns: repeat(5, auto); }
  .ap { display: inline-block; position: relative; line-height: 1; transition: transform 0.2s, opacity 0.3s; }
  .apples .ap { font-size: min(11vmin, 92px); }
  .ap.counted { transform: scale(1.18); filter: drop-shadow(0 0 1.2vmin #ffd23f); }
  .ap.counted::after { content: attr(data-n); position: absolute; right: -0.25em; top: -0.35em; font-size: 0.42em; font-weight: 800; color: var(--ink); background: #ffd23f; border-radius: 99px; padding: 0 0.3em; line-height: 1.3; font-family: var(--font); }
  .ap.hid { display: none; }
  .ap.gone { opacity: 0.25; }
  .ap.gone::before { content: "\2716"; position: absolute; left: 0; right: 0; top: 0; text-align: center; color: #e74c3c; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 2vmin; }
  .eqline { font-size: min(10vmin, 84px); font-weight: 800; display: flex; align-items: center; gap: 0.3em; }
  .eqline .n.q { color: #fff; background: #b9c3da; border-radius: 2vmin; padding: 0 0.25em; }
  .eqline .n.q.filled { background: var(--good); }
  #bulb.glow { background: #fff3b0; animation: wiggle 1.2s ease-in-out infinite; }
  .tile.ans { font-size: min(4.8vmin, 38px); font-weight: 700; padding: 2vmin 3.4vmin; max-width: 44vw; line-height: 1.25; }
  .prompt.story.long { font-size: min(4.2vmin, 36px); }
  .prompt.story.long p { margin: 0.2em 0; }
  .slots.col { flex-direction: column; align-items: stretch; counter-reset: s; width: min(80vw, 900px); }
  .slot.sent { justify-content: flex-start; height: auto; min-height: 8vmin; font-size: min(4.6vmin, 38px); padding: 1vmin 2vmin; text-align: left; }
  .slot.sent::before { counter-increment: s; content: counter(s) "."; margin-right: 0.6em; color: #9aa6c2; }
  .tile.sent { font-size: min(4.4vmin, 36px); font-weight: 700; padding: 2vmin 3vmin; max-width: 44vw; line-height: 1.25; }
  .plus { color: #8a94ad; font-weight: 800; }

  /* the monster */
  #helper { position: absolute; left: 1vmin; bottom: 1vmin; width: min(21vmin, 200px); pointer-events: none; z-index: 0; animation: bob 2.6s ease-in-out infinite; }
  #helper.chomp { animation: munch 0.32s ease-in-out 4; }
  #helper.cheer { animation: hop 0.5s ease-out 2; }
  @keyframes munch { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12, 0.9); } }
  @keyframes hop { 0%, 100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-4vmin) rotate(-6deg); } }
  #choices, #prompt { position: relative; z-index: 1; }
  @keyframes chomp { 0%, 100% { height: 16%; } 50% { height: 32%; } }
  .flyer { position: fixed; z-index: 20; pointer-events: none; transition: transform 0.6s cubic-bezier(.5,-0.3,.7,1), opacity 0.6s; }

  /* celebration */
  #party { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 30; background: rgba(255,255,255,0.55); }
  #party.on { display: flex; }
  #party .trophy { font-size: min(34vmin, 280px); animation: trophy 1s ease-out both; }
  #party .trophy img { width: min(44vmin, 380px); display: block; }
  #party .stars { font-size: min(10vmin, 80px); animation: popIn 0.6s 0.3s ease-out both; }
  @keyframes trophy { 0% { transform: scale(0) rotate(-30deg); } 60% { transform: scale(1.2) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

  /* spelling */
  .tile.letter { width: min(16vmin, 124px); height: min(16vmin, 124px); font-size: min(11vmin, 88px); font-weight: 800; }
  .slot.letter { min-width: min(11vmin, 84px); height: min(12vmin, 92px); font-size: min(8.5vmin, 68px); }
  .spellgap { display: flex; gap: 1.6vmin; font-size: min(12vmin, 96px); font-weight: 800; }
  .spellgap .ch { min-width: 0.8em; text-align: center; }
  .spellgap .ch.gap2 { min-width: 0.9em; background: #eef2fb; border-radius: 0.15em; border-bottom: 0.08em solid #9aa6c2; color: var(--good); }

  /* money */
  .coin {
    --cs: 0.42vmin; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800; flex: 0 0 auto; box-sizing: border-box;
    box-shadow: inset 0 0 0 calc(var(--cs) * 1.4) rgba(0,0,0,0.13), 0 calc(var(--cs) * 1.5) 0 rgba(0,0,0,0.18);
    background: radial-gradient(circle at 35% 30%, #f4f6f8, #aab3bd 75%); color: #4b5563;
  }
  .coin.penny { width: calc(var(--cs) * 19); height: calc(var(--cs) * 19); font-size: calc(var(--cs) * 6.5); background: radial-gradient(circle at 35% 30%, #f6b98a, #b8692e 75%); color: #5a2a0a; }
  .coin.nickel { width: calc(var(--cs) * 21.2); height: calc(var(--cs) * 21.2); font-size: calc(var(--cs) * 7); }
  .coin.dime { width: calc(var(--cs) * 17.9); height: calc(var(--cs) * 17.9); font-size: calc(var(--cs) * 6); }
  .coin.quarter { width: calc(var(--cs) * 24.3); height: calc(var(--cs) * 24.3); font-size: calc(var(--cs) * 8); }
  .tile .coin { --cs: 0.9vmin; }
  .coinpile { display: flex; flex-wrap: wrap; gap: 1.4vmin; justify-content: center; align-items: center; max-width: 80vmin; }
  .coinpile .coin { --cs: 0.55vmin; }
  .tile.cointray { width: min(19vw, 22vh); height: min(19vw, 22vh); }
  .shop { display: flex; align-items: center; gap: 4vmin; }
  .toy { font-size: min(18vmin, 140px); line-height: 1; position: relative; }
  .tag { position: absolute; right: -4vmin; top: -2vmin; background: #ffd23f; color: var(--ink); font-size: min(6vmin, 48px); font-weight: 800; padding: 0.5vmin 2vmin; border-radius: 2vmin; transform: rotate(8deg); box-shadow: 0 0.6vmin 0 rgba(0,0,0,0.15); }
  .paybox { min-width: 34vmin; min-height: 16vmin; border: 0.6vmin dashed #b9c3da; border-radius: 3vmin; display: flex; flex-wrap: wrap; gap: 1vmin; align-items: center; justify-content: center; padding: 1.4vmin; max-width: 50vmin; }
  .paybox .coin { --cs: 0.4vmin; animation: popIn 0.3s ease-out; }
  .paytotal { font-size: min(9vmin, 72px); font-weight: 800; color: #e2571e; min-width: 2.2em; text-align: center; }

  /* time */
  .clock { display: block; }
  .prompt .clock { width: min(42vmin, 340px); height: min(42vmin, 340px); }
  .tile.clockpick { width: min(27vw, 30vh); height: min(27vw, 30vh); }
  .tile.clockpick .clock { width: 88%; height: 88%; }
  .daynight { display: flex; flex-direction: column; align-items: center; gap: 1vmin; }
  .daynight .em { font-size: min(18vmin, 140px); line-height: 1; }
  .daynight .tx { font-size: min(6.6vmin, 54px); font-weight: 600; }

  /* writing */
  .prompt.trace { padding: 0; width: min(94vw, 1150px); overflow: hidden; background: #fffef8; }
  .prompt.trace canvas { display: block; width: 100%; touch-action: none; }

  /* grown-up panel */
  #settings { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20, 30, 60, 0.82); z-index: 50; color: #f2f5ff; }
  #settings.open { display: flex; }
  .panel { background: #26345e; border-radius: 22px; padding: 22px; width: min(90vw, 420px); max-height: 90vh; overflow: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; font-size: 16px; }
  .panel h2 { margin: 0; font-size: 20px; display: flex; justify-content: space-between; align-items: baseline; }
  .panel h2 small { font-size: 12px; opacity: 0.6; font-weight: 400; }
  .panel .box { background: rgba(255,255,255,0.07); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .panel .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .panel .muted { opacity: 0.7; font-size: 14px; }
  .panel button { border-radius: 12px; font-size: 17px; padding: 12px 14px; background: #3d55a0; color: #fff; position: relative; overflow: hidden; }
  .panel button.pm { width: 48px; padding: 10px 0; font-size: 22px; }
  .panel button.sel { background: #2ecc71; }
  .panel button.reset { background: #7a2a3a; }
  .panel button.reset .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: rgba(255,80,80,0.5); }
  .panel button.reset .label { position: relative; }
  .panel button.close { background: #4a5a80; }
  .panel input.kname { flex: 1; min-width: 0; font: inherit; color: #fff; background: rgba(255,255,255,0.12); border: 0; border-radius: 12px; padding: 11px 12px; -webkit-user-select: text; user-select: text; touch-action: auto; }
  .panel input.kname::placeholder { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>

<section id="home" class="screen on">
  <div id="homeTop">

  if (r.explain && ws.teach > 0 && lv.teach) {
    ws.teach--; r.taught = true; persist();
    if (r.kind === 'build') renderBuild(r); else renderChoice(r);
    restart(stageEl, 'enter');
    renderDots();
    var lead = (introPending && lv.intro ? lv.intro + ' ' : '') + 'Watch me first. ' + (r.say || '');
    introPending = false;
    setTimeout(function () { if (round === r) teach(r, lead); }, 300);
    return;
  }
  if (r.kind === 'build') renderBuild(r);
  else if (r.kind === 'shop') renderShop(r);
  else if (r.kind === 'trace') {
    renderTrace(r);
    if (ws.teach > 0) {
      ws.teach--; r.taught = true; persist();
      restart(stageEl, 'enter');
      renderDots();
      var leadT = (introPending && lv.intro ? lv.intro + ' ' : '') + 'Watch me first.';
      introPending = false;
      setTimeout(function () {
        if (round !== r) return;
        say(leadT);
        r.demo(function () { if (round === r) say('Now you try! ' + r.say); });
      }, 300);
      return;
    }
  }
  else renderChoice(r);
  restart(stageEl, 'enter');
  renderDots();
  var parts = [];
  if (introPending && lv.intro) parts.push(lv.intro);
  introPending = false;
  var autoSay = r.say;
  if (parts.length && autoSay) {
    var first = parts.join(' ');
    setTimeout(function () { if (round === r) say(first, function () { if (round === r) say(autoSay, null, r.sayRate); }); }, 300);
  } else if (parts.length) {
    setTimeout(function () { if (round === r) say(parts.join(' ')); }, 300);
  } else if (autoSay) {
    setTimeout(function () { if (round === r) say(autoSay, null, r.sayRate); }, 300);
  }
  if (!r.say && r.hint) {
    hintTimer = setTimeout(function () { if (round === r && !r.done) speakerEl.classList.add('wiggle'); }, parts.length ? 7000 : 5000);
  }
}

function renderChoice(r) {
  promptEl.className = 'prompt ' + (r.promptClass || '');
  promptEl.innerHTML = r.prompt;
  choicesEl.className = 'choices';
  choicesEl.innerHTML = '';
  var list = r.fixedOrder ? r.choices : shuffle(r.choices);
  list.forEach(function (c) {
    var b = el('button', 'tile ' + (r.choiceClass || ''), c.html);
    b.type = 'button';
    b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); onChoice(r, c, b); });
    choicesEl.appendChild(b);
    c.el = b;
  });
  if (r.countable) {
    var count = 0;
    Array.prototype.forEach.call(promptEl.querySelectorAll('.apples .ap'), function (ap) {
      ap.addEventListener('pointerdown', function (ev) {
        ev.preventDefault(); unlockAudio();
        if (r.done || r.teaching || ap.classList.contains('counted')) return;
        count++; ap.classList.add('counted'); ap.setAttribute('data-n', count); sTap(); say(String(count));
      });
    });
  }
}

function onChoice(r, c, b) {
  if (busy || r.done || r.teaching || round !== r || b.classList.contains('out')) return;
  unlockAudio();
  if (c.ok) {
    r.done = true;
    b.classList.add('right');
    sDing();
    if (c.after) c.after();
    burstFrom(b, 28);
    if (r.onRight) r.onRight();
    if (world === 'math') feedMonster(); else cheerHelper();
    roundDone(r, b);
  } else {
    r.firstTry = false; r.wrong++;
    sBoing();
    restart(b, 'shake');
    b.classList.add('out');
    if (r.explain && !r.explained) {
      r.explained = true;
      setTimeout(function () { if (round === r && !r.done) teach(r, 'Let me show you.'); }, 500);
    } else if (r.wrong >= 2 || r.choices.length - r.wrong <= 1) {
      r.choices.forEach(function (x) { if (x.ok && x.el) x.el.classList.add('hint'); });
    }
  }
}

function renderBuild(r) {
  promptEl.className = 'prompt build';
  promptEl.innerHTML = (r.pic ? '<div class="bpic">' + r.pic + '</div>' : '') + '<div class="slots ' + (r.slotsClass || '') + '"></div>';
  var slots = promptEl.querySelector('.slots');
  r.slotEls = r.units.map(function () { var s = el('span', 'slot ' + (r.slotClass || ''), '&nbsp;'); slots.appendChild(s); return s; });
  r.pos = 0; r.wrongHere = 0;
  choicesEl.className = 'choices';
  choicesEl.innerHTML = '';
  var pool = r.units.concat(r.extra || []);
  var order = pool.map(function (w, i) { return i; });
  for (var tries = 0; tries < 10; tries++) {
    order = shuffle(order);
    var same = order.every(function (v, i) { return v === i; });
    if (!same) break;
  }
  r.tiles = [];
  order.forEach(function (i) {
    var w = pool[i];
    var b = el('button', 'tile ' + (r.unitClass || 'word sm'), esc(w));
    b.type = 'button';
    b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); onBuildTap(r, w, b); });
    choicesEl.appendChild(b);
    r.tiles.push(b);
  });
}
function onBuildTap(r, w, b) {
  if (busy || r.done || round !== r || b.classList.contains('used')) return;
  unlockAudio();
  if (w === r.units[r.pos]) {
    sPop();
    var s = r.slotEls[r.pos];
    s.textContent = w; s.classList.add('filled');
    b.classList.add('used');
    r.tiles.forEach(function (t) { t.classList.remove('hint'); });
    r.pos++; r.wrongHere = 0;
    if (r.pos >= r.units.length) {
      r.done = true;
      sDing();
      burstFrom(promptEl, 40);
      cheerHelper();
      roundDone(r, promptEl);
    }
  } else {
    r.firstTry = false; r.wrongHere++;
    sBoing();
    restart(b, 'shake');
    if (r.wrongHere >= 2) {
      var want = r.units[r.pos];
      for (var i = 0; i < r.tiles.length; i++) {
        var t = r.tiles[i];
        if (!t.classList.contains('used') && t.textContent === want) { t.classList.add('hint'); break; }
      }
    }
  }
}

function cheerHelper() { restart(monsterEl, 'cheer'); }
function feedMonster() {
  var apples = promptEl.querySelectorAll('.ap:not(.gone):not(.hid)');
  var body = monsterEl;
  Array.prototype.forEach.call(apples, function (ap, i) { if (i < 12) flyTo(ap, body, '\u{1F34E}', i * 70); });
  setTimeout(function () { restart(monsterEl, 'chomp'); sChomp(); }, 450);
}

/* Progress: up after a run of first-try right answers, quietly down after two misses in three. */
function progress(firstTry) {
  var ws = save.w[world];
  var levels = LEVELS[world];
  ws.total++;
  if (firstTry) { ws.right++; ws.streak++; } else ws.streak = 0;
  ws.recent.push(firstTry ? 1 : 0);
  var keep = levels[ws.level - 1].goal ? 4 : 3;
  while (ws.recent.length > keep) ws.recent.shift();
  var def = levels[ws.level - 1], need = def.need;
  if (firstTry) ws.lvRight = (ws.lvRight || 0) + 1;
  var levelDone = def.goal ? ws.lvRight >= def.goal : ws.streak >= need;
  if (levelDone) {
    ws.streak = 0; ws.recent = []; ws.lvRight = 0;
    if (ws.level < levels.length) { ws.level++; introPending = true; ws.teach = levels[ws.level - 1].teach || 0; }
    if (ws.level > ws.best) ws.best = ws.level;
    return 'up';
  }
  var misses = ws.recent.filter(function (x) { return x === 0; }).length;
  if (misses >= (levels[ws.level - 1].goal ? 3 : 2) && ws.level > 1) {
    ws.level--; ws.streak = 0; ws.recent = []; introPending = true; ws.teach = levels[ws.level - 1].teach || 0;
    var low = levels[ws.level - 1];
    ws.lvRight = low.goal ? Math.max(0, low.goal - 5) : 0;
    return 'down';
  }
  return 'same';
}

function roundDone(r, fromNode) {
  busy = true;
  clearTimeout(hintTimer);
  speakerEl.classList.remove('wiggle');
  save.stars++;
  stopSteps();
  var res = (r.taught || r.helped) ? 'same' : progress(r.firstTry);
  persist();
  renderDots();
  var started = Date.now();
  say(r.right || pick(PRAISE), function () {
    var wait = Math.max(0, 900 - (Date.now() - started));
    setTimeout(function () {
      if (round !== r) return;
      if (res === 'up') celebrate(function () { busy = false; nextRound(); });
      else { busy = false; nextRound(); }
    }, wait);
  });
}

function celebrate(cb) {
  partyEl.classList.add('on');
  partyEl.querySelector('.trophy').innerHTML = '<img src="art/helper-' + world + '.webp" alt="">';
  partyEl.querySelector('.stars').innerHTML = '\u{1F3C6}\u2B50\u2B50\u2B50';
  restart(partyEl.querySelector('.trophy'), 'trophy');
  sFanfare();
  rain(140);
  burst(window.innerWidth / 2, window.innerHeight / 2, 60, 14);
  var line = pick(worldOf(world).cheer);
  var r = round;
  say(line, function () {
    setTimeout(function () { partyEl.classList.remove('on'); if (round === r) cb(); }, 500);
  });
}

/* ================= input wiring ================= */
function tapBtn(node, fn) {
  node.addEventListener('click', function (ev) { ev.preventDefault(); unlockAudio(); fn(ev); });
}
tapBtn($('backBtn'), function () { sTap(); showHome(); });
tapBtn(bulbEl, function () {
  if (!round || !round.explain || round.done || round.teaching || busy) return;
  sTap();
  round.helped = true; round.explained = true;
  teach(round, '');
});
tapBtn(speakerEl, function () {
  if (!round || round.teaching) return;
  speakerEl.classList.remove('wiggle');
  sTap();
  say(round.hint || '', null, round.sayRate);
});
var hubBtn = $('hubBtn');
if (HAS_HUB) hubBtn.style.visibility = 'visible';
tapBtn(hubBtn, function () { persist(); hush(); location.href = '/'; });

document.addEventListener('touchmove', function (e) { if (!e.target.closest || !e.target.closest('.panel')) e.preventDefault(); }, { passive: false });
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('touchend', unlockAudio, true);
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

/* ================= grown-up panel ================= */
var settingsEl = $('settings');
function kidLabel(k, i) { return k.face + ' ' + (k.name || 'Player ' + (i + 1)); }
function renderKids() {
  var box = $('kidBox');
  box.innerHTML = '<div class="row"><b>Players</b><span class="muted">Each has their own levels and stars</span></div>';
  store.kids.forEach(function (k, i) {
    var row = el('div', 'row');
    var face = el('button', 'pm', k.face);
    face.type = 'button'; face.setAttribute('aria-label', 'Change the picture');
    tapBtn(face, function () {
      var taken = store.kids.map(function (x) { return x.face; });
      var at = FACES.indexOf(k.face);
      for (var n = 1; n <= FACES.length; n++) {
        var f = FACES[(at + n) % FACES.length];
        if (taken.indexOf(f) < 0) { k.face = f; break; }
      }
      persist(); renderSettings();
    });
    var name = el('input', 'kname');
    name.type = 'text'; name.maxLength = 12; name.placeholder = 'Name (optional)'; name.value = k.name || '';
    name.setAttribute('autocomplete', 'off'); name.setAttribute('autocapitalize', 'words');
    name.addEventListener('input', function () {
      k.name = name.value.trim().slice(0, 12); persist();
      $('kidFor').textContent = 'Levels below are for ' + kidLabel(save, store.cur) + '.';
    });
    var use = el('button', i === store.cur ? 'sel' : '', i === store.cur ? 'Playing' : 'Play');
    use.type = 'button';
    tapBtn(use, function () { setKid(i); renderSettings(); });
    row.appendChild(face); row.appendChild(name); row.appendChild(use);
    if (store.kids.length > 1) {
      var del = el('button', 'reset', '✖');
      del.type = 'button'; del.setAttribute('aria-label', 'Remove this player');
      var armed = false;
      tapBtn(del, function () {
        if (!armed) { armed = true; del.textContent = 'Sure?'; return; }
        store.kids.splice(i, 1);
        setKid(i < store.cur ? store.cur - 1 : Math.min(store.cur, store.kids.length - 1));
        renderSettings();
      });
      row.appendChild(del);
    }
    box.appendChild(row);
  });
  if (store.kids.length < MAX_KIDS) {
    var add = el('button', '', '+ Add a player');
    add.type = 'button';
    tapBtn(add, function () {
      var taken = store.kids.map(function (x) { return x.face; });
      var free = FACES.filter(function (f) { return taken.indexOf(f) < 0; });
      store.kids.push(freshKid(free[0] || FACES[0], false));
      persist(); renderSettings();
    });
    box.appendChild(add);
  }
  $('kidFor').textContent = 'Levels below are for ' + kidLabel(save, store.cur) + '.';
}
function renderSettings() {
  $('ver').textContent = 'v' + VERSION;
  renderKids();
  var box = $('levelBoxes');
  box.innerHTML = '';
  WORLDS.forEach(function (W) {
    var ws = save.w[W.k], L = LEVELS[W.k];
    var d = el('div', 'box',
      '<div class="row"><b>' + W.icon + ' ' + W.label + '</b><span class="muted">' + ws.right + ' first-try right of ' + ws.total + (L[ws.level - 1].goal ? ' &middot; this level ' + (ws.lvRight || 0) + '/' + L[ws.level - 1].goal : '') + '</span></div>' +
      '<div class="row"><button class="pm" type="button">&minus;</button><span style="text-align:center;flex:1">Level ' + ws.level + ' of ' + L.length + ': ' + esc(L[ws.level - 1].name) + '</span><button class="pm" type="button">+</button></div>');
    var pm = d.querySelectorAll('.pm');
    tapBtn(pm[0], function () { setLevel(W.k, -1); });
    tapBtn(pm[1], function () { setLevel(W.k, 1); });
    box.appendChild(d);
  });
  $('rateSlow').classList.toggle('sel', store.rate < 0.85);
  $('rateNorm').classList.toggle('sel', store.rate >= 0.85);
  $('btnSound').textContent = store.sound ? 'On' : 'Off';
  $('voiceName').textContent = voice ? 'Using: ' + voice.name : ('speechSynthesis' in window ? 'Using the default voice' : 'This browser has no voice');
}
function setLevel(k, d) {
  var ws = save.w[k], n = LEVELS[k].length;
  ws.level = Math.max(1, Math.min(n, ws.level + d));
  ws.streak = 0; ws.recent = []; ws.lvRight = 0; ws.teach = LEVELS[k][ws.level - 1].teach || 0;
  if (ws.level > ws.best) ws.best = ws.level;
  persist(); renderSettings();
}
tapBtn($('gearBtn'), function () { renderSettings(); settingsEl.classList.add('open'); });
tapBtn($('btnClose'), function () { settingsEl.classList.remove('open'); renderHome(); });
tapBtn($('rateSlow'), function () { store.rate = 0.75; persist(); renderSettings(); say('This is the slower voice.'); });
tapBtn($('rateNorm'), function () { store.rate = 0.9; persist(); renderSettings(); say('This is the normal voice.'); });
tapBtn($('testVoice'), function () { say('The cat is on the bed.'); });
tapBtn($('btnSound'), function () { store.sound = !store.sound; persist(); renderSettings(); sPop(); });

(function holdToReset() {
  var btn = $('btnReset'), fill = btn.querySelector('.fill'), timer = null, start = 0, HOLD = 1500;
  function tick() {
    var p = Math.min(1, (Date.now() - start) / HOLD);
    fill.style.width = (p * 100) + '%';
    if (p >= 1) {
      stop();
      /* Only the player who is playing now. Their face and name stay. */
      var again = freshKid(save.face, store.cur === 0);
      again.name = save.name;
      store.kids[store.cur] = again; save = again;
      hist = {};
      persist(); renderSettings(); renderHome();
      sBoing();
      return;
    }
    timer = requestAnimationFrame(tick);
  }
  function stop() { if (timer) cancelAnimationFrame(timer); timer = null; fill.style.width = '0%'; }
  btn.addEventListener('pointerdown', function (e) { e.preventDefault(); start = Date.now(); stop(); timer = requestAnimationFrame(tick); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (t) { btn.addEventListener(t, stop); });
})();

/* ================= lifecycle ================= */
function onResize() { sizeFx(); if (round && round.relayout) round.relayout(); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', function () { setTimeout(onResize, 200); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { hush(); persist(); }
});
window.addEventListener('pagehide', persist);
sizeFx();
renderHome();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

/* Test hook for automated checks (harmless in play). */
window.__wnl = { save: function () { return save; }, store: function () { return store; },round: function () { return round; }, levels: LEVELS, enter: enterWorld, home: showHome, worlds: WORLDS, glyphOf: glyphOf };
})();
</script>
